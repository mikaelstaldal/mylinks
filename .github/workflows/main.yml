# Builds the project and publishes the binary as a rolling `latest` release.
name: Build

# Work lands by pushing to main rather than through pull requests, so there is
# no pre-merge gate to hang these jobs off: they report on what has already
# landed. A bad commit turns the run red rather than being stopped from
# arriving. Add `pull_request:` here if that ever changes.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, and never cancel one midway
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Overrides the workflow default only to add contents: write, which the
    # release step needs to move the `latest` tag and upload the binary.
    permissions:
      contents: write
    # The longest job here: two installs, then build.sh running build, tests and
    # lint, then the scan and the release. It also holds the workflow's
    # concurrency group, which does not cancel in progress, so a job hung on the
    # six hour default would queue every later push behind it for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # build.sh expects golangci-lint on $PATH and never installs anything
      # itself (see AGENTS.md). govulncheck is not a build.sh tool, it is run by
      # the next step, but its pin belongs with the others.
      - name: Install build tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Silent on success; on failure it prints the failing step and exits non-zero
      - name: Build
        run: ./build.sh

      # Ahead of the release step, so a build with a known vulnerability reachable
      # from this code is never published. In the default source mode only
      # reachable symbols fail the job; a vulnerability in a module we merely
      # require is reported and ignored. This catches new advisories against
      # unchanged code too, but only when something is pushed, which is why the
      # weekly scan in govulncheck.yml exists alongside it.
      - name: Check for known vulnerabilities
        run: govulncheck ./...

      # Publishes the binary ./build.sh produced as a rolling release, so
      # https://github.com/<owner>/<repo>/releases/latest always serves the
      # newest green build of main. `gh` is preinstalled on the runner, so this
      # pulls in no third-party action.
      #
      # A rolling release means the `latest` tag has to move: delete the
      # release and its tag, then recreate both at this commit. The delete is
      # tolerant of there being nothing to delete (the first run), but the
      # create is not — if that fails, the job fails.
      - name: Release the binary
        env:
          GH_TOKEN: ${{ github.token }}
          # Via the environment rather than spliced into the command line, so
          # the value can never be read as shell syntax.
          SHA: ${{ github.sha }}
        run: |
          # The asset name says what it is: the static linux/amd64 binary,
          # which is the only platform ./build.sh targets here.
          cp mylinks mylinks-linux-amd64
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mylinks-linux-amd64 \
            --target "$SHA" \
            --title "Latest build from main" \
            --notes "Automated build of \`main\` at commit $SHA."

  # The image is built but never pushed, so this needs no registry credentials.
  #
  # Its own job rather than a step in `build`, so it runs in parallel and a
  # broken image does not hold up the binary release. Both are independent
  # artifacts of the same commit; a failure here still turns the run red.
  #
  # Worth having because the Dockerfile pins a `golang:` base image while go.mod
  # pins the toolchain, and the two can drift apart: the official images set
  # GOTOOLCHAIN=local, so a base image older than the `go` directive fails the
  # build. That drift shipped undetected once already.
  docker:
    runs-on: ubuntu-latest
    # Same as the workflow default, stated so that a later change to that
    # default does not silently widen what building an image can do.
    permissions:
      contents: read
    # Generous because there is no layer cache: every run pulls golang and the
    # sizeable headless-shell base image, then compiles from scratch. If it is
    # still going after this long it is stuck, not slow.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # `docker` is preinstalled on the runner, so this pulls in no third-party
      # action. The tag is throwaway and exists only because `docker build`
      # wants somewhere to put the result.
      - name: Build the Docker image
        run: docker build -t mylinks:ci .
